<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绝密文件 · 扫码启封</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);overflow-x:hidden;position:relative;padding:40px 20px 120px}
.bg-particles{position:absolute;inset:0;overflow:hidden;z-index:0}
.particle{position:absolute;width:4px;height:4px;background:rgba(255,215,0,.6);border-radius:50%;animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) scale(1);opacity:.6}50%{transform:translateY(-30px) scale(1.5);opacity:1}}
.card{position:relative;z-index:1;background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,215,0,.3);border-radius:24px;padding:40px 32px;text-align:center;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);animation:cardIn .8s cubic-bezier(.16,1,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.stamp{display:inline-block;border:3px solid #e74c3c;color:#e74c3c;font-size:14px;font-weight:900;letter-spacing:4px;padding:6px 16px;border-radius:6px;transform:rotate(-8deg);margin-bottom:20px;animation:stampPulse 2s ease-in-out infinite}
@keyframes stampPulse{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(-8deg) scale(1.05)}}
h1{font-size:28px;font-weight:900;color:#ffd700;margin-bottom:8px;text-shadow:0 0 20px rgba(255,215,0,.5);letter-spacing:2px}
.subtitle{font-size:14px;color:rgba(255,255,255,.6);margin-bottom:32px;letter-spacing:1px}
.qr-grid{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.qr-item{flex:1;min-width:200px;max-width:260px}
.qr-wrapper{position:relative;display:inline-block;padding:14px;background:#fff;border-radius:16px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.qr-wrapper.pdf{box-shadow:0 10px 30px rgba(231,76,60,.3)}
.qr-wrapper.doubao{box-shadow:0 10px 30px rgba(74,108,247,.3)}
.qr-wrapper img{display:block;width:180px;height:180px;border-radius:8px}
.qr-label{font-size:15px;font-weight:700;margin-bottom:4px}
.qr-label.pdf{color:#e74c3c}
.qr-label.doubao{color:#6c8cff}
.qr-desc{font-size:12px;color:rgba(255,255,255,.5)}
.divider{display:flex;align-items:center;gap:12px;margin:24px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,215,0,.4),transparent)}
.divider span{font-size:12px;color:rgba(255,215,0,.8);letter-spacing:2px;white-space:nowrap}
.tip-box{background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.2);border-radius:12px;padding:16px 20px;text-align:left;margin-bottom:20px}
.tip-box p{font-size:13px;color:rgba(255,255,255,.7);line-height:1.8}
.tip-box strong{color:#ffd700}
.hint{font-size:14px;color:rgba(255,255,255,.8);font-weight:600;margin-bottom:4px}
.hint-small{font-size:12px;color:rgba(255,255,255,.4);letter-spacing:1px}
.corner{position:absolute;width:28px;height:28px;border-color:#ffd700;border-style:solid}
.corner-tl{top:10px;left:10px;border-width:3px 0 0 3px;border-radius:8px 0 0 0}
.corner-tr{top:10px;right:10px;border-width:3px 3px 0 0;border-radius:0 8px 0 0}
.corner-bl{bottom:10px;left:10px;border-width:0 0 3px 3px;border-radius:0 0 0 8px}
.corner-br{bottom:10px;right:10px;border-width:0 3px 3px 0;border-radius:0 0 8px 0}
.pet-container{position:fixed;bottom:0;left:0;z-index:100;pointer-events:none;will-change:transform}
.pet{position:relative;width:90px;height:100px;cursor:pointer;pointer-events:auto;transition:transform .15s ease-out}
.pet:active{transform:scale(.92)}
.pet-body-wrap{position:absolute;bottom:0;left:50%;width:70px;height:75px;transform:translateX(-50%);animation:petIdle 2.4s ease-in-out infinite;transform-origin:bottom center}
@keyframes petIdle{0%,100%{transform:translateX(-50%) translateY(0) rotate(0)}25%{transform:translateX(-50%) translateY(-3px) rotate(-1.5deg)}75%{transform:translateX(-50%) translateY(-3px) rotate(1.5deg)}}
.pet.walking .pet-body-wrap{animation:petWalkBob .4s ease-in-out infinite}
@keyframes petWalkBob{0%,100%{transform:translateX(-50%) translateY(0) rotate(-2deg)}50%{transform:translateX(-50%) translateY(-5px) rotate(2deg)}}
.pet-tail{position:absolute;bottom:20px;right:-8px;width:22px;height:30px;background:linear-gradient(180deg,#fff5f7,#ffd0dc);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform-origin:bottom left;animation:tailWag 1.2s ease-in-out infinite;z-index:0}
@keyframes tailWag{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(20deg)}}
.pet.walking .pet-tail{animation:tailWagFast .35s ease-in-out infinite}
@keyframes tailWagFast{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(35deg)}}
.pet-body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:64px;height:62px;background:linear-gradient(180deg,#fff5f7 0%,#ffe0e8 100%);border-radius:50% 50% 45% 45%;box-shadow:0 4px 12px rgba(0,0,0,.15),inset 0 -4px 8px rgba(255,150,170,.2);z-index:1}
.pet-ear{position:absolute;top:-6px;width:18px;height:24px;background:linear-gradient(180deg,#fff5f7,#ffd0dc);border-radius:50% 50% 30% 30%;z-index:0;transform-origin:bottom center}
.pet-ear.left{left:6px;transform:rotate(-18deg);animation:earTwitchLeft 5s ease-in-out infinite}
.pet-ear.right{right:6px;transform:rotate(18deg);animation:earTwitchRight 5.5s ease-in-out infinite}
@keyframes earTwitchLeft{0%,92%,100%{transform:rotate(-18deg)}94%{transform:rotate(-30deg)}96%{transform:rotate(-10deg)}98%{transform:rotate(-18deg)}}
@keyframes earTwitchRight{0%,88%,100%{transform:rotate(18deg)}90%{transform:rotate(30deg)}92%{transform:rotate(10deg)}94%{transform:rotate(18deg)}}
.pet-ear::after{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);width:8px;height:12px;background:#ffb3c6;border-radius:50%}
.pet-eye{position:absolute;top:20px;width:13px;height:15px;background:#2d2d2d;border-radius:50%;overflow:hidden;z-index:2;animation:blink 4.5s ease-in-out infinite}
.pet-eye.left{left:14px}.pet-eye.right{right:14px}
.pet-eye::before{content:'';position:absolute;top:2px;left:3px;width:5px;height:5px;background:#fff;border-radius:50%;transition:transform .1s ease-out}
.pet-eye::after{content:'';position:absolute;bottom:2px;right:2px;width:3px;height:3px;background:rgba(255,255,255,.5);border-radius:50%}
@keyframes blink{0%,46%,54%,100%{transform:scaleY(1)}50%{transform:scaleY(.08)}}
.pet-cheek{position:absolute;top:34px;width:11px;height:7px;background:#ff9eb5;border-radius:50%;opacity:.65;z-index:2}
.pet-cheek.left{left:8px}.pet-cheek.right{right:8px}
.pet-mouth{position:absolute;top:37px;left:50%;transform:translateX(-50%);width:11px;height:7px;border:2px solid #2d2d2d;border-top:none;border-radius:0 0 12px 12px;z-index:2;transition:all .2s ease}
.pet.happy .pet-mouth{width:14px;height:9px;border-width:2.5px}
.pet-foot{position:absolute;bottom:-4px;width:16px;height:10px;background:linear-gradient(180deg,#ffd0dc,#ffb3c6);border-radius:50%;z-index:0}
.pet-foot.left{left:12px}.pet-foot.right{right:12px}
.pet-bubble{position:absolute;bottom:85px;left:50%;transform:translateX(-50%) scale(0) translateY(10px);background:#fff;color:#333;font-size:12px;font-weight:600;padding:8px 14px;border-radius:16px;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.15);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:10}
.pet-bubble::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #fff}
.pet.talking .pet-bubble{opacity:1;transform:translateX(-50%) scale(1) translateY(0)}
.pet-heart{position:absolute;top:0;font-size:18px;opacity:0;pointer-events:none;z-index:5}
.pet.loved .pet-heart{animation:heartFloat 1.2s ease-out forwards}
@keyframes heartFloat{0%{opacity:1;transform:translateY(0) scale(.4) rotate(0)}30%{opacity:1;transform:translateY(-20px) scale(1.1) rotate(-10deg)}100%{opacity:0;transform:translateY(-50px) scale(.8) rotate(15deg)}}
.pet.sleeping .pet-eye{animation:none;height:3px;top:26px;border-radius:3px}
.pet-sleep-z{position:absolute;top:-10px;right:0;font-size:16px;color:rgba(255,255,255,.7);font-weight:700;opacity:0;animation:sleepZ 2s ease-in-out infinite}
.pet.sleeping .pet-sleep-z{opacity:1}
@keyframes sleepZ{0%{opacity:0;transform:translateY(0) scale(.5)}30%{opacity:.8}100%{opacity:0;transform:translateY(-25px) scale(1.2)}}
.pet-shadow{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:50px;height:10px;background:rgba(0,0,0,.2);border-radius:50%;filter:blur(3px);animation:shadowPulse 2.4s ease-in-out infinite}
@keyframes shadowPulse{0%,100%{transform:translateX(-50%) scaleX(1);opacity:.3}50%{transform:translateX(-50%) scaleX(.85);opacity:.2}}
</style>
</head>

<script>
var container=document.getElementById('particles');
for(var i=0;i<30;i++){var p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.top=Math.random()*100+'%';p.style.animationDelay=Math.random()*6+'s';p.style.animationDuration=(4+Math.random()*4)+'s';container.appendChild(p);}
var pet=document.getElementById('pet'),bubble=document.getElementById('petBubble'),eyeLeft=document.getElementById('eyeLeft'),eyeRight=document.getElementById('eyeRight');
var phrases=['扫码呀~ ♡','点我干嘛~','嘻嘻嘻 ♪','快去扫码！','你好呀~','机密哦！','喵~','别走嘛~','摸摸头~','好无聊呀'];
var phraseIdx=0,isWalking=true,isSleeping=false,direction=1,posX=0,walkSpeed=1.2,lastActivity=Date.now();
function walk(){if(!isWalking||isSleeping)return;posX+=direction*walkSpeed;var maxX=window.innerWidth-90;if(posX>=maxX){posX=maxX;direction=-1;}if(posX<=0){posX=0;direction=1;}pet.style.transform='translateX('+posX+'px) scaleX('+direction+')';requestAnimationFrame(walk);}
walk();
function setWalking(w){isWalking=w;pet.classList.toggle('walking',w);}
function say(text,duration){duration=duration||2200;bubble.textContent=text;pet.classList.add('talking');lastActivity=Date.now();setTimeout(function(){pet.classList.remove('talking');},duration);}
pet.addEventListener('click',function(){if(isSleeping){isSleeping=false;pet.classList.remove('sleeping');say('唔...醒啦！');setWalking(true);return;}phraseIdx=(phraseIdx+1)%phrases.length;say(phrases[phraseIdx]);pet.classList.add('loved','happy');setTimeout(function(){pet.classList.remove('loved');},1200);setTimeout(function(){pet.classList.remove('happy');},1500);});
pet.addEventListener('mouseenter',function(){if(!isSleeping){pet.classList.add('happy');setWalking(false);lastActivity=Date.now();}});
pet.addEventListener('mouseleave',function(){pet.classList.remove('happy');if(!isSleeping)setWalking(true);});
document.addEventListener('mousemove',function(e){if(isSleeping)return;var r=pet.getBoundingClientRect();var cx=r.left+r.width/2,cy=r.top+r.height/2;var dx=e.clientX-cx,dy=e.clientY-cy;var angle=Math.atan2(dy,dx);var dist=Math.min(3,Math.hypot(dx,dy)/100);var ox=Math.cos(angle)*dist,oy=Math.sin(angle)*dist;eyeLeft.style.transform='translate('+(ox*0.5)+'px,'+(oy*0.5)+'px)';eyeRight.style.transform='translate('+(ox*0.5)+'px,'+(oy*0.5)+'px)';});
setInterval(function(){if(isSleeping)return;var idle=Date.now()-lastActivity;if(idle>15000&&Math.random()<0.3){isSleeping=true;pet.classList.add('sleeping');setWalking(false);say('呼...好困~',1500);return;}var r=Math.random();if(r<0.25){phraseIdx=Math.floor(Math.random()*phrases.length);say(phrases[phraseIdx]);}else if(r<0.4){setWalking(false);setTimeout(function(){if(!isSleeping)setWalking(true);},2000+Math.random()*2000);}},4000);
window.addEventListener('resize',function(){var maxX=window.innerWidth-90;if(posX>maxX)posX=maxX;});
</script>
